---
- name: Ensure Apache NiFi Registry paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ nifi_registry_uid }}"
    group: "{{ nifi_registry_gid }}"
  with_items:
    - "{{ nifi_registry_base_path }}"
    - "{{ nifi_registry_data_path }}"
    - "{{ nifi_registry_scripts_path }}"
    - "{{ nifi_registry_data_path }}/conf"
    - "{{ nifi_registry_data_path }}/database"
    - "{{ nifi_registry_data_path }}/flow_storage"
    - "{{ nifi_registry_data_path }}/extension_bundles"
    - "{{ nifi_registry_data_path }}/logs"
    - "{{ nifi_registry_data_path }}/work"
    - "{{ nifi_registry_data_path }}/run"

- name: Ensure Apache NiFi Registry temporary configuration customization directory exists
  ansible.builtin.tempfile:
    state: directory
    suffix: nifi-registry
  changed_when: false
  register: nifi_registry_tempdir

- name: Copy Apache NiFi Registry default configuration files for customization
  ansible.builtin.copy:
    src: "{{ role_path }}/files/conf/{{ item }}"
    dest: "{{ nifi_registry_tempdir.path }}/{{ item }}"
    mode: "0640"
    owner: "{{ nifi_registry_uid }}"
    group: "{{ nifi_registry_gid }}"
  changed_when: false
  with_items:
    - authorizers.xml
    - bootstrap.conf
    - identity-providers.xml
    - logback.xml
    - nifi-registry.properties
    - providers.xml
    - registry-aliases.xml
  register: nifi_registry_config_files_default_result

- name: Ensure Apache NiFi Registry XML configuration files have the defined adjustments
  community.general.xml:
    path: "{{ nifi_registry_tempdir.path }}/{{ item.0.file }}"
    xpath: "{{ item.1.xpath }}"
    value: "{{ item.1.value | default(omit) }}"
    state: "{{ item.1.state | default('present') }}"
    pretty_print: "{{ item.1.pretty_print | default(true) }}"
  changed_when: false
  with_subelements:
    - - { "file": "authorizers.xml", "parameters": "{{ nifi_registry_authorizers_xml_replacements }}" }
      - { "file": "identity-providers.xml", "parameters": "{{ nifi_registry_identity_providers_xml_replacements }}" }
      - { "file": "logback.xml", "parameters": "{{ nifi_registry_logback_xml_replacements }}" }
      - { "file": "providers.xml", "parameters": "{{ nifi_registry_providers_xml_replacements }}" }
      - { "file": "registry-aliases.xml", "parameters": "{{ nifi_registry_registry_aliases_xml_replacements }}" }
    - parameters
  register: nifi_registry_config_files_xml_result

- name: Ensure Apache NiFi Registry properties configuration files have the defined adjustments
  no_log: "{{ nifi_registry_no_log }}"
  ansible.builtin.lineinfile:
    path: "{{ nifi_registry_tempdir.path }}/{{ item.0.file }}"
    line: "{{ item.1.key }}={{ item.1.value }}"
    regexp: "^{{ item.1.key | regex_escape }}="
    state: "{{ item.1.state | default('present') }}"
  changed_when: false
  with_subelements:
    - - { "file": "nifi-registry.properties", "parameters": "{{ nifi_registry_properties_replacements }}" }
      - { "file": "bootstrap.conf", "parameters": "{{ nifi_registry_bootstrap_conf_replacements }}" }
    - parameters
  register: nifi_registry_config_files_properties_result

- name: Ensure Apache NiFi Registry adjusted configuration files installed
  ansible.builtin.copy:
    src: "{{ nifi_registry_tempdir.path }}/{{ item }}"
    dest: "{{ nifi_registry_data_path }}/conf/{{ item }}"
    remote_src: true
    mode: "0640"
    owner: "{{ nifi_registry_uid }}"
    group: "{{ nifi_registry_gid }}"
  with_items:
    - authorizers.xml
    - bootstrap.conf
    - identity-providers.xml
    - logback.xml
    - nifi-registry.properties
    - providers.xml
    - registry-aliases.xml
  register: nifi_registry_config_files_adjusted_result

- name: Ensure Apache NiFi Registry temporary configuration customization directory is removed
  ansible.builtin.file:
    path: "{{ nifi_registry_tempdir.path }}"
    state: absent
  changed_when: false

- name: Ensure Apache NiFi Registry support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ nifi_registry_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ nifi_registry_uid }}"
    group: "{{ nifi_registry_gid }}"
  with_items:
    - env
    - labels
  register: nifi_registry_support_files_result

- name: Ensure Apache NiFi Registry custom scripts installed
  ansible.builtin.copy:
    src: "{{ role_path }}/files/scripts/{{ item }}"
    dest: "{{ nifi_registry_scripts_path }}/{{ item }}"
    mode: "0751"
    owner: "{{ nifi_registry_uid }}"
    group: "{{ nifi_registry_gid }}"
  with_items:
    - common.sh
    - start.sh
  register: nifi_registry_scripts_result

- name: Ensure Apache NiFi Registry container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ nifi_registry_container_image }}"
    pull: always
  register: nifi_registry_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: nifi_registry_container_image_pull_result_ansible_module is not failed

- name: Ensure Apache NiFi Registry container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ nifi_registry_container_image }}"
  register: nifi_registry_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: nifi_registry_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in nifi_registry_container_image_pull_result_command.stdout"

- name: Ensure Apache NiFi Registry container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ nifi_registry_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: nifi_registry_network_creation_result

- name: Ensure Apache NiFi Registry container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ nifi_registry_container_network }}
  register: nifi_registry_network_creation_result
  changed_when: nifi_registry_network_creation_result.rc == 0
  failed_when: nifi_registry_network_creation_result.rc != 0 and 'already exists' not in nifi_registry_network_creation_result.stderr

- name: Ensure Apache NiFi Registry systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/nifi-registry.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ nifi_registry_identifier }}.service"
    mode: "0644"
  register: nifi_registry_systemd_service_result

- name: Determine whether Apache NiFi Registry needs a restart
  ansible.builtin.set_fact:
    nifi_registry_restart_necessary: >-
      {{
        nifi_registry_config_files_adjusted_result.changed | default(false)
        or nifi_registry_support_files_result.changed | default(false)
        or nifi_registry_scripts_result.changed | default(false)
        or nifi_registry_systemd_service_result.changed | default(false)
        or nifi_registry_container_image_pull_result_ansible_module.changed | default(false)
        or nifi_registry_container_image_pull_result_command.changed | default(false)
      }}
