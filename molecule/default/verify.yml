---
- name: Verify Apache NiFi Registry
  hosts: all
  become: true
  gather_facts: false

  vars:
    # `nifi_registry_container_http_port` comes from the scenario's group_vars and is deliberately
    # not Apache NiFi Registry's own default of 18080. See molecule.yml.
    nifi_registry_base_url: "http://localhost:{{ nifi_registry_container_http_port }}"
    nifi_registry_api_url: "{{ nifi_registry_base_url }}/nifi-registry-api"

    nifi_registry_verify_units:
      - nifi-registry.service

  tasks:
    - name: Verify that Apache NiFi Registry works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below to whatever the role pins.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: nifi_registry_defaults

        - name: Wait for the Apache NiFi Registry systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: nifi_registry_services
          until: nifi_registry_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ nifi_registry_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Apache NiFi Registry systemd services are active
          ansible.builtin.assert:
            that: nifi_registry_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(nifi_registry_verify_units | zip(nifi_registry_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Apache NiFi Registry systemd services log for debugging
          when: nifi_registry_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ nifi_registry_verify_units }}"

        # Apache NiFi Registry is a JVM application and needs a while before it accepts
        # connections. Until then the port is simply closed, so this loop is what separates
        # "still booting" from "never coming up".
        - name: Wait for the Apache NiFi Registry web interface to respond (up to 5m)
          ansible.builtin.uri:
            url: "{{ nifi_registry_base_url }}/nifi-registry/"
            method: GET
            follow_redirects: none
            status_code: [200, 301, 302, 404, 502, 503]
          register: nifi_registry_web_interface
          until: nifi_registry_web_interface.status == 200
          retries: 60
          delay: 5
          failed_when: false

        # Reaching this on `nifi_registry_container_http_port` (19080 in this scenario) is what proves
        # that the role's `nifi.registry.web.http.port` replacement reached the process: the image ships
        # 18080, and the container only publishes the port the role was told about, so a registry that
        # ignored the role's `nifi-registry.properties` would be listening where nothing is mapped.
        - name: Assert that the Apache NiFi Registry web interface responds on the configured port
          ansible.builtin.assert:
            that: nifi_registry_web_interface.status == 200
            fail_msg: >-
              Apache NiFi Registry did not serve its web interface on port {{ nifi_registry_container_http_port }}
              (got {{ nifi_registry_web_interface.status | default('no response') }})
            success_msg: "Apache NiFi Registry serves its web interface on port {{ nifi_registry_container_http_port }}"

        - name: Query the version of the running Apache NiFi Registry
          ansible.builtin.uri:
            url: "{{ nifi_registry_api_url }}/about"
            method: GET
          register: nifi_registry_about

        - name: Assert the running Apache NiFi Registry is the version this role installs
          ansible.builtin.assert:
            that: nifi_registry_about.json.registryAboutVersion == nifi_registry_defaults.nifi_registry_version
            fail_msg: "Apache NiFi Registry reports {{ nifi_registry_about.json.registryAboutVersion | default('none') }}, expected {{ nifi_registry_defaults.nifi_registry_version }}"
            success_msg: "Apache NiFi Registry reports {{ nifi_registry_about.json.registryAboutVersion }}"

        # Unique per run, so that `molecule verify` can be repeated against the same instance.
        - name: Pick a name for the test bucket
          ansible.builtin.set_fact:
            nifi_registry_test_bucket_name: "molecule-{{ now(utc=true, fmt='%Y%m%d%H%M%S%f') }}"

        # Storing a flow version is the thing Apache NiFi Registry exists for, and it touches both
        # of the places data lives: the metadata goes to the `database` directory, the flow contents
        # to `flow_storage` (via the file-system flow persistence provider in providers.xml).
        - name: Create a bucket in Apache NiFi Registry
          ansible.builtin.uri:
            url: "{{ nifi_registry_api_url }}/buckets"
            method: POST
            body_format: json
            body:
              name: "{{ nifi_registry_test_bucket_name }}"
          register: nifi_registry_bucket

        - name: Create a flow in the Apache NiFi Registry bucket
          ansible.builtin.uri:
            url: "{{ nifi_registry_api_url }}/buckets/{{ nifi_registry_bucket.json.identifier }}/flows"
            method: POST
            body_format: json
            body:
              name: molecule-flow
              type: Flow
          register: nifi_registry_flow

        - name: Store a version of the Apache NiFi Registry flow
          ansible.builtin.uri:
            url: "{{ nifi_registry_api_url }}/buckets/{{ nifi_registry_bucket.json.identifier }}/flows/{{ nifi_registry_flow.json.identifier }}/versions"
            method: POST
            body_format: json
            body:
              snapshotMetadata:
                version: 1
                comments: Stored by Molecule
              flowContents:
                identifier: molecule-process-group
                name: molecule-process-group
                componentType: PROCESS_GROUP

        # Everything the process writes outside the mounted directories disappears with the container
        # (it is created with `--rm`), so a restart is what tells a mounted data directory apart from
        # one that only lives inside the container.
        - name: Restart Apache NiFi Registry
          ansible.builtin.systemd_service:
            name: nifi-registry.service
            state: restarted

        - name: Wait for Apache NiFi Registry to come back after the restart (up to 5m)
          ansible.builtin.uri:
            url: "{{ nifi_registry_api_url }}/about"
            method: GET
            status_code: [200, 404, 502, 503]
          register: nifi_registry_about_after_restart
          until: nifi_registry_about_after_restart.status == 200
          retries: 60
          delay: 5
          failed_when: false

        - name: Retrieve the stored flow version after the restart
          ansible.builtin.uri:
            url: "{{ nifi_registry_api_url }}/buckets/{{ nifi_registry_bucket.json.identifier }}/flows/{{ nifi_registry_flow.json.identifier }}/versions/1"
            method: GET
            status_code: [200, 404, 502, 503]
          register: nifi_registry_flow_version
          failed_when: false

        - name: Assert that the stored flow version survived the restart
          ansible.builtin.assert:
            that:
              - nifi_registry_flow_version.status == 200
              - nifi_registry_flow_version.json.bucket.name == nifi_registry_test_bucket_name
              - nifi_registry_flow_version.json.flowContents.name == 'molecule-process-group'
            fail_msg: >-
              The flow version stored before the restart is gone
              (status {{ nifi_registry_flow_version.status | default('no response') }}), so the `database`
              or `flow_storage` directory is not persisted outside the container
            success_msg: "The flow version stored before the restart survived it"

        - name: Stat the Apache NiFi Registry database file
          ansible.builtin.stat:
            path: /nifi-registry/data/database/nifi-registry-primary.mv.db
          register: nifi_registry_database_file

        - name: Read the user the Apache NiFi Registry process runs as
          ansible.builtin.command:
            cmd: docker exec nifi-registry id -u
          register: nifi_registry_process_uid
          changed_when: false

        # The scenario deliberately uses a uid other than the image's own 1000 (see molecule.yml).
        - name: Assert that Apache NiFi Registry runs as, and writes its data as, the configured user
          ansible.builtin.assert:
            that:
              - nifi_registry_process_uid.stdout | int == nifi_registry_uid | int
              - nifi_registry_database_file.stat.exists
              - nifi_registry_database_file.stat.uid == nifi_registry_uid | int
            fail_msg: >-
              Expected the process and its database to belong to uid {{ nifi_registry_uid }}; the process runs as
              {{ nifi_registry_process_uid.stdout | default('?') }} and the database file
              {{ ('belongs to uid ' ~ nifi_registry_database_file.stat.uid) if nifi_registry_database_file.stat.exists else 'does not exist' }}
            success_msg: "Apache NiFi Registry runs as, and writes its data as, uid {{ nifi_registry_uid }}"

        - name: Read the marker file mounted through nifi_registry_container_additional_volumes
          ansible.builtin.command:
            cmd: docker exec nifi-registry cat /nifi-registry-molecule-extra/marker.txt
          register: nifi_registry_additional_volume
          changed_when: false
          failed_when: false

        - name: Assert that nifi_registry_container_additional_volumes is rendered into the container
          ansible.builtin.assert:
            that: "'mounted-via-nifi_registry_container_additional_volumes' in (nifi_registry_additional_volume.stdout | default(''))"
            fail_msg: >-
              The directory named by nifi_registry_container_additional_volumes_custom is not mounted in the
              container, so that variable is not reaching the `docker create` command as a `--mount`
            success_msg: "nifi_registry_container_additional_volumes is rendered into the container as a --mount"

        # This role is unusual in that it ships upstream's own configuration files verbatim under
        # files/conf/ and reapplies its customizations on top of them at install time. A new Apache
        # NiFi Registry release that changes any of them therefore needs those copies refreshed by hand,
        # as docs/updating-nifi-registry.md describes. Comparing them against the image the role actually
        # pins turns that manual procedure into something CI enforces, which is what makes it safe to let
        # a patch-level version bump merge without a human reading the diff.
        - name: Copy the shipped Apache NiFi Registry configuration files to the test host
          ansible.builtin.copy:
            src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/files/conf/"
            dest: /tmp/nifi-registry-shipped-conf/
            mode: "0644"

        - name: Checksum the shipped Apache NiFi Registry configuration files
          ansible.builtin.command:
            cmd: sh -c 'cd /tmp/nifi-registry-shipped-conf && sha256sum * | sort -k 2'
          register: nifi_registry_shipped_conf
          changed_when: false

        - name: Checksum the upstream configuration files inside the Apache NiFi Registry image
          ansible.builtin.command:
            cmd: >-
              docker run --rm --entrypoint sh
              docker.io/apache/nifi-registry:{{ nifi_registry_defaults.nifi_registry_version }}
              -c 'cd /opt/nifi-registry/nifi-registry-current/conf && sha256sum
              authorizers.xml bootstrap.conf identity-providers.xml logback.xml
              nifi-registry.properties providers.xml registry-aliases.xml | sort -k 2'
          register: nifi_registry_image_conf
          changed_when: false

        - name: Assert that the shipped configuration files match the pinned Apache NiFi Registry image
          ansible.builtin.assert:
            that: nifi_registry_shipped_conf.stdout == nifi_registry_image_conf.stdout
            fail_msg: >-
              files/conf/ no longer matches apache/nifi-registry:{{ nifi_registry_defaults.nifi_registry_version }}.
              Refresh those files from the new image and re-check the `nifi_registry_*_replacements_default`
              variables, as described in docs/updating-nifi-registry.md.
            success_msg: "files/conf/ matches apache/nifi-registry:{{ nifi_registry_defaults.nifi_registry_version }}"

        # The scenario leaves `nifi_registry_identifier` at its default, so the base path is /nifi-registry.
        - name: Read the container label file
          ansible.builtin.slurp:
            src: /nifi-registry/labels
          register: nifi_registry_labels

        # Traefik is disabled in this scenario, so not one Traefik label may be emitted. Roles across
        # this fleet have repeatedly grown labels outside the `traefik_enabled` conditional.
        - name: Assert that no Traefik labels are emitted while Traefik is disabled
          ansible.builtin.assert:
            that: "'traefik' not in (nifi_registry_labels.content | b64decode)"
            fail_msg: "Traefik labels are emitted even though nifi_registry_container_labels_traefik_enabled is false"
            success_msg: "No Traefik labels are emitted while Traefik is disabled"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "nifi_registry_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: nifi_registry_restarts_before
              loop: "{{ nifi_registry_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: nifi_registry_restarts_after
              loop: "{{ nifi_registry_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - nifi_registry_restarts_after.results | map(attribute='status.NRestarts') | list == nifi_registry_restarts_before.results | map(attribute='status.NRestarts') | list
                  - nifi_registry_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in nifi_registry_verify_units | zip(nifi_registry_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in nifi_registry_verify_units | zip(nifi_registry_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in nifi_registry_verify_units | zip(nifi_registry_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Apache NiFi Registry verification summary
          ansible.builtin.debug:
            msg:
              - "Apache NiFi Registry systemd: {% for unit, state in nifi_registry_verify_units | zip(nifi_registry_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Apache NiFi Registry version: {{ nifi_registry_about.json.registryAboutVersion }}"
              - "Apache NiFi Registry web interface on port {{ nifi_registry_container_http_port }}: HTTP {{ nifi_registry_web_interface.status }}"
              - "Apache NiFi Registry flow version after a restart: HTTP {{ nifi_registry_flow_version.status }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Apache NiFi Registry systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=nifi-registry.service
          register: nifi_registry_service_log
          changed_when: false

        - name: Show the Apache NiFi Registry systemd service log
          ansible.builtin.debug:
            var: nifi_registry_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Apache NiFi Registry verification failed. The systemd service log is printed above."
